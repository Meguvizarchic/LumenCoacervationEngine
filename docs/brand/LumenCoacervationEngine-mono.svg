<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 72 72" role="img" aria-labelledby="title desc"><title id="title">LumenCoacervationEngine</title><desc id="desc">两片凝光曲面共用同一个R22圆形外包络，并严格180°对应。透镜负形由镜向二次曲线构造，端口净距4、中央宽12.4，形成有控制的渐宽透镜，修复两端错位与外沿曲率不一。</desc><g transform="translate(1.14766 0.97177) scale(1.10751)"><path fill="#4B3F63" d="M42.928126017 12.90612502A22 22 0 0 0 17.795265806 48.799569235Q23.480818739 26.034805062 42.928126017 12.90612502Z"/><path fill="#4B3F63" d="M21.071873983 51.09387498A22 22 0 0 0 46.204734194 15.200430765Q40.519181261 37.965194938 21.071873983 51.09387498Z"/></g></svg>